<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Sort Colours & Shapes</title><link rel="stylesheet" href="/assets/site-shell.css"><link rel="stylesheet" href="/assets/games.css"></head><body>
<main class="game-wrap"><h1 class="game-title">🎨 Sort &amp; Learn</h1><div class="progress-card"><span id="progressText">0 of 10 completed</span><div class="progress-track"><div class="progress-fill" id="progressFill"></div></div></div><section class="game-card" id="gameCard"><p class="prompt" id="prompt"></p><div class="sort-object" id="object"></div><div class="choices" id="choices"></div><p class="feedback" id="feedback" aria-live="polite"></p></section></main>
<script src="/assets/site-shell.js"></script><script>
(function(){
 const activity="sort-colours-shapes";const colours=[["red","#f24f67"],["blue","#3a7eea"],["yellow","#ffd52e"],["green","#35bd73"]],shapes=["circle","square","triangle","star"];let round=1,busy=false;
 const byId=id=>document.getElementById(id),shuffle=a=>a.map(v=>[Math.random(),v]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]);
 const api=async(path,options={})=>{const r=await fetch(path,{credentials:"same-origin",headers:{"Content-Type":"application/json"},...options});const j=await r.json();if(!r.ok)throw new Error(j.error||"Try again.");return j};
 function update(n){byId("progressText").textContent=n+" of 10 completed";byId("progressFill").style.width=(n*10)+"%"}
 function challenge(){const colour=colours[(round*3)%colours.length],shape=shapes[(round*5)%shapes.length],askColour=round%2===0;return{colour,shape,askColour,answer:askColour?colour[0]:shape}}
 function render(){busy=false;const c=challenge();byId("prompt").textContent=c.askColour?"Which colour is it?":"Which shape is it?";byId("object").innerHTML='<div class="shape '+c.shape+'" style="--colour:'+c.colour[1]+'"></div>';const options=c.askColour?colours.map(x=>x[0]):shapes;byId("choices").innerHTML=shuffle(options).slice(0,3).concat([]).map(v=>'<button class="choice" type="button" data-value="'+v+'">'+v[0].toUpperCase()+v.slice(1)+'</button>').join("");if(![...byId("choices").children].some(b=>b.dataset.value===c.answer)){byId("choices").lastElementChild.dataset.value=c.answer;byId("choices").lastElementChild.textContent=c.answer[0].toUpperCase()+c.answer.slice(1)}byId("feedback").textContent="";byId("choices").querySelectorAll("button").forEach(b=>b.onclick=()=>choose(b,c.answer))}
 async function choose(button,answer){if(busy)return;if(button.dataset.value!==answer){button.classList.add("wrong");byId("feedback").textContent="Have another look!";setTimeout(()=>button.classList.remove("wrong"),450);return}busy=true;button.classList.add("correct");byId("feedback").textContent="Brilliant sorting!";try{const result=await api("/api/progress/complete",{method:"POST",body:JSON.stringify({activity,item:"round-"+round})});update(result.count);if(result.exercise_completed&&result.reward_token){byId("gameCard").innerHTML='<div class="celebrate">🎉⭐🎉</div><h2>Sorting complete!</h2><p>You earned a sticker.</p>';await ProfileShell.claimReward(result.reward_token);return}round=round===10?1:round+1;setTimeout(render,650)}catch(e){busy=false;byId("feedback").textContent=e.message}}
 ProfileShell.ready.then(async()=>{try{const p=await api("/api/progress?activity="+activity);update(p.count);round=1;while(p.completed_items.includes("round-"+round)&&round<10)round++;render()}catch(e){byId("feedback").textContent=e.message}});
})();
</script></body></html>
