<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Match the Pairs</title><link rel="stylesheet" href="/assets/site-shell.css"><link rel="stylesheet" href="/assets/games.css"></head><body>
<main class="game-wrap"><h1 class="game-title">🧠 Match the Pairs</h1><div class="progress-card"><span id="progressText">0 of 6 pairs found</span><div class="progress-track"><div class="progress-fill" id="progressFill"></div></div></div><section class="game-card" id="gameCard"><p class="prompt">Turn over two cards. Can you find a pair?</p><div class="matching-grid" id="grid"></div><p class="feedback" id="feedback" aria-live="polite"></p></section></main>
<script src="/assets/site-shell.js"></script><script>
(function(){
 const activity="match-the-pairs",animals=[["cat","🐱"],["dog","🐶"],["frog","🐸"],["fish","🐠"],["lion","🦁"],["rabbit","🐰"]];let first=null,locked=false,done=new Set();
 const byId=id=>document.getElementById(id),shuffle=a=>a.map(v=>[Math.random(),v]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]);
 const api=async(path,options={})=>{const r=await fetch(path,{credentials:"same-origin",headers:{"Content-Type":"application/json"},...options});const j=await r.json();if(!r.ok)throw new Error(j.error||"Try again.");return j};
 function update(n){byId("progressText").textContent=n+" of 6 pairs found";byId("progressFill").style.width=(n/6*100)+"%"}
 function render(){const deck=shuffle(animals.flatMap(([id,icon])=>[{id,icon,key:id+"-a"},{id,icon,key:id+"-b"}]));byId("grid").innerHTML=deck.map(c=>'<button class="match-card '+(done.has(c.id)?"matched":"")+'" type="button" data-id="'+c.id+'" '+(done.has(c.id)?"disabled":"")+'><span>'+c.icon+'</span></button>').join("");byId("grid").querySelectorAll("button:not(:disabled)").forEach(b=>b.onclick=()=>flip(b))}
 async function flip(button){if(locked||button===first)return;button.classList.add("flipped");if(!first){first=button;return}if(first.dataset.id!==button.dataset.id){locked=true;byId("feedback").textContent="Not that pair. Try again!";setTimeout(()=>{first.classList.remove("flipped");button.classList.remove("flipped");first=null;locked=false},650);return}locked=true;const id=button.dataset.id;first.classList.add("matched");button.classList.add("matched");first.disabled=true;button.disabled=true;done.add(id);byId("feedback").textContent="You found a pair!";try{const result=await api("/api/progress/complete",{method:"POST",body:JSON.stringify({activity,item:id})});update(result.count);first=null;locked=false;if(result.exercise_completed&&result.reward_token){byId("gameCard").innerHTML='<div class="celebrate">🎉⭐🎉</div><h2>All pairs found!</h2><p>You earned a sticker.</p>';await ProfileShell.claimReward(result.reward_token)}}catch(e){byId("feedback").textContent=e.message;first=null;locked=false}}
 ProfileShell.ready.then(async()=>{try{const p=await api("/api/progress?activity="+activity);done=new Set(p.completed_items);update(p.count);render()}catch(e){byId("feedback").textContent=e.message}});
})();
</script></body></html>
