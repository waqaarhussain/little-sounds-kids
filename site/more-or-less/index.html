<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Which Has More?</title><link rel="stylesheet" href="../assets/site-shell.css"><link rel="stylesheet" href="../assets/games.css"></head><body>
<main class="game-wrap"><h1 class="game-title">⚖️ Which Has More?</h1><div class="progress-card"><span id="progressText">0 of 20 completed</span><div class="progress-track"><div class="progress-fill" id="progressFill"></div></div></div><section class="game-card" id="gameCard"><p class="prompt">Tap the side with more pictures.</p><div class="more-grid" id="choices"></div><p class="feedback" id="feedback" aria-live="polite"></p></section></main>
<script src="../assets/site-shell.js"></script><script>
(function(){const activity="more-or-less";let rounds=[],index=0,busy=false;const byId=id=>document.getElementById(id);const api=async(path,options={})=>{const r=await fetch(ProfileShell.url(path),{credentials:"same-origin",headers:{"Content-Type":"application/json"},...options});const j=await r.json();if(!r.ok)throw new Error(j.error||"Try again.");return j};
function progress(n){byId("progressText").textContent=n+" of 20 completed";byId("progressFill").style.width=(n/20*100)+"%"}function render(){busy=false;const q=rounds[index];byId("choices").innerHTML='<button class="more-choice" type="button" data-side="left">'+Array(q.left_count).fill(q.left_icon).join(" ")+'</button><button class="more-choice" type="button" data-side="right">'+Array(q.right_count).fill(q.right_icon).join(" ")+'</button>';byId("feedback").textContent="";byId("choices").querySelectorAll("button").forEach(b=>b.onclick=()=>choose(b,q))}
async function choose(button,q){if(busy)return;if(button.dataset.side!==q.answer){button.classList.add("wrong");byId("feedback").textContent="Count both sides and try again!";setTimeout(()=>button.classList.remove("wrong"),450);return}busy=true;button.classList.add("correct");byId("feedback").textContent="That side has more!";try{const result=await api("/api/progress/complete",{method:"POST",body:JSON.stringify({activity,item:q.item})});progress(result.count);if(result.exercise_completed&&result.reward_token){byId("gameCard").innerHTML='<div class="celebrate">⚖️🎉⭐</div><h2>Comparing complete!</h2><p>You earned a sticker.</p>';await ProfileShell.claimReward(result.reward_token);return}index=rounds.findIndex(r=>!result.completed_items.includes(r.item));setTimeout(render,650)}catch(e){busy=false;byId("feedback").textContent=e.message}}
ProfileShell.ready.then(async()=>{try{const p=await api("/api/progress?activity="+activity);const v=await api("/api/activity/variant?activity="+activity);rounds=v.plan.rounds;progress(p.count);index=rounds.findIndex(r=>!p.completed_items.includes(r.item));if(index<0)index=0;render()}catch(e){byId("feedback").textContent=e.message}})})();</script></body></html>
