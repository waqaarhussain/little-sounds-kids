<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#5c45bd">
  <meta name="description" content="A colourful home for books and activities for little learners.">
  <title>Little Learners</title>
  <link rel="stylesheet" href="/assets/site-shell.css">
  <style>
    :root { color-scheme:light; --ink:#263657; --navy:#253469; --purple:#7158e8; --pink:#ef4f85; --yellow:#ffdc55; --blue:#45bff1; --green:#38b66a; }
    * { box-sizing:border-box; }
    html,body { min-height:100%; }
    body {
      margin:0;
      min-width:320px;
      color:var(--ink);
      font-family:ui-rounded,"Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;
      background:
        radial-gradient(circle at 9% 13%,rgba(255,255,255,.88) 0 3.8rem,transparent 3.9rem),
        radial-gradient(circle at 91% 24%,rgba(255,255,255,.76) 0 5rem,transparent 5.1rem),
        linear-gradient(155deg,#7359e8 0%,#54c9ef 43%,#dff8f1 70%,#ffe58e 100%);
      overflow-x:hidden;
      -webkit-tap-highlight-color:transparent;
    }
    a:focus-visible { outline:5px solid rgba(35,49,99,.42); outline-offset:5px; }
    .shell {
      width:min(1120px,100%);
      min-height:100svh;
      margin:auto;
      padding:max(82px,calc(env(safe-area-inset-top) + 72px)) clamp(16px,4vw,48px) max(26px,env(safe-area-inset-bottom));
      display:grid;
      grid-template-rows:auto auto 1fr auto;
      gap:clamp(18px,4vw,32px);
    }
    .brand {
      width:max-content;
      max-width:calc(100% - 160px);
      display:flex;
      align-items:center;
      gap:10px;
      padding:9px 16px 9px 10px;
      border:4px solid rgba(255,255,255,.92);
      border-radius:999px;
      color:#fff;
      background:var(--navy);
      box-shadow:0 7px 0 rgba(24,34,79,.48);
      font-size:clamp(1rem,3vw,1.45rem);
      font-weight:1000;
      letter-spacing:-.025em;
    }
    .brand-mark { width:42px; aspect-ratio:1; display:grid; place-items:center; border-radius:14px; background:linear-gradient(135deg,#ff4f6f,#ffad32); box-shadow:0 4px 0 #bd334d; }
    .hero { max-width:760px; margin:auto; text-align:center; }
    .hero h1 { margin:0; color:var(--navy); font-size:clamp(2.55rem,8vw,5.2rem); line-height:.92; letter-spacing:-.06em; text-shadow:0 4px 0 rgba(255,255,255,.85); }
    .hero h1 span { color:#fff; text-shadow:0 5px 0 #4d39ae; }
    .hero p { margin:14px auto 0; max-width:570px; font-size:clamp(1rem,2.6vw,1.25rem); line-height:1.4; font-weight:950; }
    .activity-grid {
      width:min(950px,100%);
      margin:0 auto;
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(180px,220px));
      justify-content:center;
      align-content:start;
      gap:clamp(15px,3vw,24px);
    }
    .activity-card {
      position:relative;
      width:100%;
      aspect-ratio:1/1.08;
      min-width:0;
      display:grid;
      grid-template-rows:1fr auto;
      overflow:hidden;
      border:6px solid #fff;
      border-radius:29px;
      color:var(--ink);
      background:rgba(255,255,255,.94);
      box-shadow:0 10px 0 var(--card-shadow),0 18px 34px rgba(34,48,96,.2);
      text-decoration:none;
      transition:transform .16s ease,box-shadow .16s ease;
    }
    .activity-card:hover { transform:translateY(-5px); }
    .activity-card:active { transform:translateY(3px); box-shadow:0 5px 0 var(--card-shadow); }
    .activity-visual { position:relative; min-height:0; display:grid; place-items:center; overflow:hidden; background:var(--card-bg); }
    .activity-copy { min-height:82px; padding:12px 13px 14px; display:grid; align-content:center; text-align:center; }
    .activity-copy strong { display:block; font-size:1.22rem; line-height:1.05; }
    .activity-copy span { display:block; margin-top:5px; color:#5e6d87; font-size:.78rem; line-height:1.15; font-weight:850; }
    .phonics-card { --card-shadow:#2e64b5; --card-bg:linear-gradient(180deg,#72d7fa 0 62%,#ffe47b 62%); }
    .rainbow { position:absolute; width:190px; height:120px; top:-53px; border:12px solid #ef4b5a; border-radius:50%; box-shadow:0 0 0 12px #ff9f29,0 0 0 24px #ffdc45,0 0 0 36px #46b96d,0 0 0 48px #377fd3,0 0 0 60px #7953d0; }
    .phonics-letters { z-index:1; display:flex; gap:5px; align-items:end; font-size:3.8rem; line-height:1; font-weight:1000; text-shadow:0 4px 0 #fff; }
    .phonics-letters span:nth-child(1){color:#ef4656;transform:rotate(-7deg)}
    .phonics-letters span:nth-child(2){color:#2778d8;transform:translateY(-7px)}
    .phonics-letters span:nth-child(3){color:#35ac58;transform:rotate(7deg)}
    .picture-row { position:absolute; z-index:2; bottom:8px; font-size:1.65rem; letter-spacing:.08em; filter:drop-shadow(0 3px 1px rgba(42,57,82,.18)); }
    .tracing-card { --card-shadow:#c23b69; --card-bg:linear-gradient(145deg,#fff8d2,#f5e8ff); }
    .trace-paper { width:72%; aspect-ratio:1; display:grid; place-items:center; border:5px solid #fff; border-radius:22px; background:repeating-linear-gradient(0deg,#fff 0 25px,#eaf2fc 26px,#fff 27px); box-shadow:0 7px 18px rgba(74,64,120,.16); transform:rotate(-3deg); }
    .trace-letter { color:transparent; -webkit-text-stroke:3px #ef4f85; font-size:6rem; line-height:1; font-weight:1000; text-shadow:3px 3px 0 rgba(239,79,133,.13); }
    .pencil { position:absolute; right:18px; bottom:13px; font-size:2.7rem; transform:rotate(-30deg); filter:drop-shadow(0 4px 2px rgba(61,53,82,.18)); }
    .footer { align-self:end; color:#604d19; text-align:center; font-weight:950; }
    @media(max-width:560px){
      .shell{gap:21px}.brand{max-width:calc(100% - 145px);padding-right:12px}.brand-mark{width:36px}.hero h1{font-size:clamp(2.5rem,13vw,4rem)}
      .activity-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.activity-card{border-width:5px;border-radius:23px}.activity-copy{min-height:76px;padding:10px 8px 12px}.activity-copy strong{font-size:1.02rem}.activity-copy span{font-size:.69rem}.phonics-letters{font-size:3rem}.rainbow{transform:scale(.78)}.trace-letter{font-size:4.8rem}.pencil{font-size:2.1rem;right:8px}
    }
    @media(max-width:355px){.activity-grid{grid-template-columns:1fr;width:190px}}
    @media(prefers-reduced-motion:reduce){*{transition:none!important}}
  </style>
</head>
<body>
  <main class="shell">
    <header><div class="brand"><span class="brand-mark">📚</span><span>Little Learners</span></div></header>
    <section class="hero"><h1>Pick something<br><span>fun to learn!</span></h1><p>Tap an activity to start playing, listening and learning.</p></section>
    <section class="activity-grid" aria-label="Learning activities">
      <a class="activity-card phonics-card" href="/phonicsbook/" aria-label="Open My Fun Phonics Book">
        <span class="activity-visual" aria-hidden="true"><i class="rainbow"></i><span class="phonics-letters"><span>A</span><span>B</span><span>C</span></span><span class="picture-row">🍎 🐘 🐱 🐶</span></span>
        <span class="activity-copy"><strong>Fun Phonics</strong><span>Letters, sounds and pictures</span></span>
      </a>
      <a class="activity-card tracing-card" href="/handwriting/" aria-label="Open Fun Tracing">
        <span class="activity-visual" aria-hidden="true"><span class="trace-paper"><span class="trace-letter">A</span></span><span class="pencil">✏️</span></span>
        <span class="activity-copy"><strong>Fun Tracing</strong><span>Letters, numbers and shapes</span></span>
      </a>
    </section>
    <footer class="footer">Made for little learners ❤️</footer>
  </main>
  <script src="/assets/audio-player.js"></script>
  <script src="/assets/site-shell.js"></script>
</body>
</html>
