<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Count &amp; Choose</title><link rel="stylesheet" href="/assets/site-shell.css"><link rel="stylesheet" href="/assets/games.css"></head><body>
<main class="game-wrap"><h1 class="game-title">🍎 Count &amp; Choose</h1><div class="progress-card"><span id="progressText">0 of 20 completed</span><div class="progress-track"><div class="progress-fill" id="progressFill"></div></div></div><section class="game-card" id="gameCard"><p class="prompt" id="prompt">How many can you count?</p><div class="object-cloud" id="objects"></div><div class="choices" id="choices"></div><p class="feedback" id="feedback" aria-live="polite"></p></section></main>
<script src="/assets/site-shell.js"></script><script>
(function(){
 const activity="count-and-choose";let rounds=[],roundIndex=0,busy=false;
 const byId=id=>document.getElementById(id);
 const api=async(path,options={})=>{const r=await fetch(path,{credentials:"same-origin",headers:{"Content-Type":"application/json"},...options});const j=await r.json();if(!r.ok)throw new Error(j.error||"Try again.");return j};
 function update(n){byId("progressText").textContent=n+" of 20 completed";byId("progressFill").style.width=(n/20*100)+"%"}
 function render(){busy=false;const challenge=rounds[roundIndex];if(!challenge)return;byId("prompt").textContent="How many "+challenge.name+" can you count?";byId("objects").textContent=Array(challenge.count).fill(challenge.icon).join(" ");byId("choices").innerHTML=challenge.choices.map(n=>'<button class="choice" type="button" data-value="'+n+'">'+n+'</button>').join("");byId("feedback").textContent="";byId("choices").querySelectorAll("button").forEach(b=>b.onclick=()=>choose(b,challenge))}
 async function choose(button,challenge){if(busy)return;if(Number(button.dataset.value)!==challenge.count){button.classList.add("wrong");byId("feedback").textContent="Have another count!";setTimeout(()=>button.classList.remove("wrong"),450);return}busy=true;button.classList.add("correct");byId("feedback").textContent="Great counting!";try{const result=await api("/api/progress/complete",{method:"POST",body:JSON.stringify({activity,item:challenge.item})});update(result.count);if(result.exercise_completed&&result.reward_token){byId("gameCard").innerHTML='<div class="celebrate">🎉⭐🎉</div><h2>Counting complete!</h2><p>You earned a sticker.</p>';await ProfileShell.claimReward(result.reward_token);return}roundIndex=rounds.findIndex(r=>!result.completed_items.includes(r.item));if(roundIndex<0)roundIndex=0;setTimeout(render,650)}catch(e){busy=false;byId("feedback").textContent=e.message}}
 ProfileShell.ready.then(async()=>{try{const p=await api("/api/progress?activity="+activity);const variant=await api("/api/activity/variant?activity="+activity);rounds=variant.plan.rounds;update(p.count);roundIndex=rounds.findIndex(r=>!p.completed_items.includes(r.item));if(roundIndex<0)roundIndex=0;render()}catch(e){byId("feedback").textContent=e.message}});
})();
</script></body></html>
