<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Count & Choose</title><link rel="stylesheet" href="/assets/site-shell.css"><link rel="stylesheet" href="/assets/games.css"></head><body>
<main class="game-wrap"><h1 class="game-title">🍎 Count &amp; Choose</h1><div class="progress-card"><span id="progressText">0 of 10 completed</span><div class="progress-track"><div class="progress-fill" id="progressFill"></div></div></div><section class="game-card" id="gameCard"><p class="prompt" id="prompt">How many can you count?</p><div class="object-cloud" id="objects"></div><div class="choices" id="choices"></div><p class="feedback" id="feedback" aria-live="polite"></p></section></main>
<script src="/assets/site-shell.js"></script><script>
(function(){
 const activity="count-and-choose", icons=["🍎","⭐","🐞","🐠","🦋","🍓","🌼","🚗","🐸","🍪"]; let round=1,busy=false;
 const byId=id=>document.getElementById(id);
 const api=async(path,options={})=>{const r=await fetch(path,{credentials:"same-origin",headers:{"Content-Type":"application/json"},...options});const j=await r.json();if(!r.ok)throw new Error(j.error||"Try again.");return j};
 const shuffle=a=>a.map(v=>[Math.random(),v]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]);
 function update(n){byId("progressText").textContent=n+" of 10 completed";byId("progressFill").style.width=(n*10)+"%"}
 function render(){busy=false;const count=round,icon=icons[(round-1)%icons.length];byId("objects").textContent=Array(count).fill(icon).join(" ");let opts=new Set([count]);while(opts.size<3)opts.add(Math.max(1,Math.min(10,count+Math.floor(Math.random()*7)-3)));byId("choices").innerHTML=shuffle([...opts]).map(n=>'<button class="choice" type="button" data-value="'+n+'">'+n+'</button>').join("");byId("feedback").textContent="";byId("choices").querySelectorAll("button").forEach(b=>b.onclick=()=>choose(b,count))}
 async function choose(button,answer){if(busy)return;if(Number(button.dataset.value)!==answer){button.classList.add("wrong");byId("feedback").textContent="Have another count!";setTimeout(()=>button.classList.remove("wrong"),450);return}busy=true;button.classList.add("correct");byId("feedback").textContent="Great counting!";try{const result=await api("/api/progress/complete",{method:"POST",body:JSON.stringify({activity,item:"round-"+round})});update(result.count);if(result.exercise_completed&&result.reward_token){byId("gameCard").innerHTML='<div class="celebrate">🎉⭐🎉</div><h2>Counting complete!</h2><p>You earned a sticker.</p>';await ProfileShell.claimReward(result.reward_token);return}round=round===10?1:round+1;setTimeout(render,650)}catch(e){busy=false;byId("feedback").textContent=e.message}}
 ProfileShell.ready.then(async()=>{try{const p=await api("/api/progress?activity="+activity);update(p.count);round=1;while(p.completed_items.includes("round-"+round)&&round<10)round++;render()}catch(e){byId("feedback").textContent=e.message}});
})();
</script></body></html>
