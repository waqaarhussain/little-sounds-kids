<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#7158e8">
  <meta name="robots" content="noindex,nofollow">
  <title>All Stickers</title>
  <link rel="stylesheet" href="/assets/site-shell.css">
  <style>
    :root { color-scheme:light; --ink:#263657; }
    * { box-sizing:border-box; }
    body { margin:0; min-width:320px; min-height:100svh; color:var(--ink); font-family:ui-rounded,"Arial Rounded MT Bold",system-ui,sans-serif; background:linear-gradient(155deg,#765ce8 0%,#61cef1 40%,#e6f9f2 69%,#ffe79a 100%); }
    .shell { width:min(1280px,100%); margin:auto; padding:max(84px,calc(env(safe-area-inset-top) + 76px)) clamp(12px,3vw,38px) 36px; }
    .hero { padding:clamp(20px,4vw,36px); border:6px solid #fff; border-radius:30px; color:#fff; background:linear-gradient(135deg,#7258e8,#9d69ed); box-shadow:0 10px 0 #4c35ad; text-align:center; }
    .hero h1 { margin:0; font-size:clamp(2.1rem,7vw,4.6rem); line-height:1; text-shadow:0 4px 0 #4c35ad; }
    .hero p { margin:10px 0 0; font-weight:900; }
    .summary { margin:24px 0 0; text-align:center; font-size:1.05rem; font-weight:950; }
    .category { margin:24px 0; padding:clamp(13px,2.4vw,24px); border:5px solid #fff; border-radius:28px; background:rgba(255,255,255,.78); box-shadow:0 9px 24px rgba(40,70,110,.16); }
    .category h2 { margin:0 0 14px; font-size:clamp(1.45rem,4vw,2.35rem); }
    .category h2 span { color:#7258e8; font-size:.72em; }
    .grid { display:grid; grid-template-columns:repeat(8,minmax(0,1fr)); gap:clamp(7px,1.4vw,14px); }
    .sticker { position:relative; min-width:0; aspect-ratio:1; overflow:hidden; border:3px solid #fff; border-radius:20px; background:#fff; box-shadow:0 5px 12px rgba(45,58,91,.16); }
    .sticker img { width:100%; height:100%; display:block; object-fit:contain; }
    .serial,.status { position:absolute; z-index:2; padding:4px 7px; border-radius:999px; font-size:clamp(.56rem,1.5vw,.74rem); font-weight:1000; }
    .serial { top:5px; left:5px; background:#ffe15c; }
    .status { right:5px; bottom:5px; color:#fff; background:#12a67c; }
    .status.staged { background:#7258e8; }
    .status.retired { background:#7d879a; }
    .empty { grid-column:1/-1; padding:30px; border:3px dashed #b6c2d4; border-radius:20px; color:#687795; text-align:center; font-weight:900; }
    .error { margin:30px 0; padding:24px; border:4px solid #fff; border-radius:22px; color:#a3213c; background:#ffe8ee; text-align:center; font-weight:950; }
    @media(max-width:1000px){.grid{grid-template-columns:repeat(6,minmax(0,1fr))}}
    @media(max-width:720px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}.sticker{border-radius:15px}}
    @media(max-width:430px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
  </style>
</head>
<body>
  <main class="shell">
    <section class="hero"><h1>✨ All Stickers</h1><p>Every sticker currently stored on this VPS, grouped by theme.</p></section>
    <p class="summary" id="summary">Loading sticker catalogue…</p>
    <div id="catalogue" aria-live="polite"></div>
  </main>
  <script src="/assets/audio-player.js"></script>
  <script src="/assets/site-shell.js"></script>
  <script>
    const escapeText = value => String(value ?? "").replace(/[&<>"']/g, character => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[character]);

    async function refreshCatalogue() {
      try {
        const response = await fetch(`/api/all-stickers?time=${Date.now()}`, { credentials:"same-origin", cache:"no-store" });
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || "Could not load the sticker catalogue.");
        document.getElementById("summary").textContent = `${data.total} stickers on the VPS. Refreshed ${new Date(data.refreshed_at).toLocaleTimeString("en-GB")}.`;
        document.getElementById("catalogue").innerHTML = data.categories.map(category => `
          <section class="category">
            <h2>${escapeText(category.label)} <span>${category.count} stickers</span></h2>
            <div class="grid">
              ${category.stickers.length ? category.stickers.map(sticker => `
                <article class="sticker">
                  <span class="serial">#${sticker.serial}</span>
                  <img src="${escapeText(sticker.image)}" alt="${escapeText(category.label)} sticker ${sticker.serial}" loading="lazy">
                  <span class="status ${escapeText(sticker.status)}">${escapeText(sticker.status)}</span>
                </article>`).join("") : '<p class="empty">No stickers generated yet.</p>'}
            </div>
          </section>`).join("");
      } catch (error) {
        document.getElementById("catalogue").innerHTML = `<p class="error">${escapeText(error.message)} Retrying automatically…</p>`;
      }
    }

    refreshCatalogue();
    setInterval(refreshCatalogue, 30000);
  </script>
</body>
</html>
