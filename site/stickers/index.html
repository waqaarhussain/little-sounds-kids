<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#7158e8"><title>My Sticker Book</title><link rel="stylesheet" href="../assets/site-shell.css"><style>
:root{color-scheme:light;--ink:#263657}*{box-sizing:border-box}body{margin:0;min-width:320px;min-height:100svh;color:var(--ink);font-family:ui-rounded,"Arial Rounded MT Bold",system-ui,sans-serif;background:radial-gradient(circle at 12% 9%,rgba(255,255,255,.9) 0 3.5rem,transparent 3.6rem),linear-gradient(155deg,#765ce8 0%,#61cef1 40%,#e6f9f2 69%,#ffe79a 100%)}.shell{width:min(1180px,100%);margin:auto;padding:max(105px,calc(env(safe-area-inset-top) + 94px)) clamp(16px,4vw,48px) max(30px,env(safe-area-inset-bottom))}.hero{padding:clamp(23px,5vw,42px);border:7px solid #fff;border-radius:34px;color:#fff;background:linear-gradient(135deg,#7258e8,#9d69ed);box-shadow:0 13px 0 #4c35ad;text-align:center}.hero h1{margin:0;font-size:clamp(2.4rem,8vw,5rem);line-height:.95;text-shadow:0 5px 0 #4c35ad}.hero p{position:relative;left:18px;margin:12px 0 0;font-size:clamp(1rem,3vw,1.3rem);font-weight:900}.toolbar{margin:28px 0 18px;display:flex;justify-content:flex-end}.parent-tabs{display:flex;gap:9px}.parent-tabs button{border:0;border-radius:999px;padding:11px 17px;color:#30405f;background:#fff;box-shadow:0 5px 0 #c8d7ec;font-weight:950}.parent-tabs button.active{color:#fff;background:#7258e8;box-shadow:0 5px 0 #4c35ad}.album-title{margin:0;font-size:clamp(1.7rem,5vw,2.7rem)}.sticker-grid{margin-top:18px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:clamp(13px,2.5vw,24px)}.sticker-card{position:relative;min-width:0;border:6px solid #fff;border-radius:28px;padding:10px;background:rgba(255,255,255,.72);box-shadow:0 10px 24px rgba(54,56,104,.17);text-align:center}.sticker-card img{width:100%;aspect-ratio:1;display:block;object-fit:contain}.number{position:absolute;top:10px;left:10px;min-width:39px;padding:7px 9px;border-radius:999px;color:#775400;background:#ffe25b;font-weight:1000;box-shadow:0 3px 0 #d3ac21;z-index:2}.label{margin:3px 0 2px;font-weight:950}.earned-for{margin:0 0 5px;color:#697794;font-size:.78rem;font-weight:850}.empty{position:relative;left:18px;margin-top:20px;padding:45px 20px;border:5px dashed rgba(75,83,128,.25);border-radius:28px;background:rgba(255,255,255,.55);text-align:center;font-size:1.2rem;font-weight:900}.sticker-card.just-earned{animation:newSticker 1.2s ease 3;box-shadow:0 0 0 9px #fff,0 0 38px 18px #ffe13d}.sticker-card.just-earned::after{content:"NEW! ✨";position:absolute;right:8px;top:9px;background:#f14f73;color:#fff;border-radius:999px;padding:7px 10px;font-weight:1000}@keyframes newSticker{50%{transform:translateY(-10px) rotate(2deg) scale(1.04)}}@media(max-width:800px){.sticker-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:560px){.shell{padding-top:92px}.hero p,.empty{left:8px}.sticker-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.sticker-card{border-width:4px;border-radius:22px}}
</style></head><body><main class="shell"><section class="hero"><h1>🌟 My Sticker Book</h1><p>Every sticker remembers something you got right!</p></section><div class="toolbar"><div class="parent-tabs" id="parentTabs" hidden></div></div><h2 class="album-title" id="albumTitle">Loading stickers...</h2><section class="sticker-grid" id="stickerGrid" aria-live="polite"></section><div class="empty" id="emptyMessage" hidden>Win your first sticker in Find the Picture! 🎯</div></main>
<script src="../assets/site-shell.js"></script><script>
const params=new URLSearchParams(location.search),requested=params.get("profile")||"",newPosition=Number(params.get("new")||0);
async function loadAlbum(requestedProfile=""){await ProfileShell.ready;const query=requestedProfile?"?profile="+encodeURIComponent(requestedProfile):"";const response=await fetch(ProfileShell.url("/api/rewards"+query),{credentials:"same-origin"});const data=await response.json();document.getElementById("albumTitle").textContent=data.profile+"'s stickers ("+data.stickers.length+")";const grid=document.getElementById("stickerGrid");grid.innerHTML=data.stickers.map(sticker=>'<article class="sticker-card '+(sticker.position===newPosition?"just-earned":"")+'" data-position="'+sticker.position+'"><span class="number">'+sticker.position+'</span><img src="'+sticker.image+'" alt="'+sticker.category_label+' sticker number '+sticker.position+'" loading="lazy"><p class="label">'+sticker.category_label+'</p><p class="earned-for">'+(sticker.activity==="good-behaviour"?"Good Behaviour":"Activity Complete")+'</p></article>').join("");document.getElementById("emptyMessage").hidden=data.stickers.length!==0;document.querySelectorAll("#parentTabs button").forEach(button=>button.classList.toggle("active",button.dataset.profile===data.profile));const fresh=grid.querySelector(".just-earned");if(fresh)setTimeout(()=>fresh.scrollIntoView({behavior:"smooth",block:"center"}),180)}
ProfileShell.ready.then(profile=>{const tabs=document.getElementById("parentTabs");if(profile===ProfileShell.parentProfile){tabs.hidden=false;tabs.innerHTML=ProfileShell.childProfiles.map(name=>'<button data-profile="'+name+'">'+name+'</button>').join("");tabs.querySelectorAll("button").forEach(button=>button.addEventListener("click",()=>loadAlbum(button.dataset.profile)));loadAlbum(requested&&ProfileShell.childProfiles.includes(requested)?requested:ProfileShell.childProfiles[0])}else loadAlbum()});
</script></body></html>
