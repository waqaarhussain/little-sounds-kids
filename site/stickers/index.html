<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#7158e8">
  <title>My Sticker Book</title>
  <link rel="stylesheet" href="/assets/site-shell.css">
  <style>
    :root { color-scheme: light; --ink:#263657; }
    * { box-sizing:border-box; }
    body { margin:0; min-width:320px; min-height:100svh; color:var(--ink); font-family:ui-rounded,"Arial Rounded MT Bold",system-ui,sans-serif; background:radial-gradient(circle at 12% 9%,#fff 0 3.5rem,transparent 3.6rem),linear-gradient(160deg,#66d1f8,#efe7ff 48%,#fff1a8); }
    .shell { width:min(1180px,100%); margin:auto; padding:max(84px,calc(env(safe-area-inset-top) + 76px)) clamp(16px,4vw,48px) max(30px,env(safe-area-inset-bottom)); }
    .hero { padding:clamp(23px,5vw,42px); border:7px solid #fff; border-radius:34px; color:#fff; background:linear-gradient(135deg,#7258e8,#9d69ed); box-shadow:0 13px 0 #4c35ad; text-align:center; }
    .hero h1 { margin:0; font-size:clamp(2.4rem,8vw,5rem); line-height:.95; text-shadow:0 5px 0 #4c35ad; }
    .hero p { margin:12px 0 0; font-size:clamp(1rem,3vw,1.3rem); font-weight:900; }
    .toolbar { margin:28px 0 18px; display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; }
    .back { padding:12px 19px; border-radius:999px; color:#28405f; background:#fff; box-shadow:0 5px 0 #c8d7ec; text-decoration:none; font-weight:950; }
    .parent-tabs { display:flex; gap:9px; }
    .parent-tabs button { border:0; border-radius:999px; padding:11px 17px; color:#30405f; background:#fff; box-shadow:0 5px 0 #c8d7ec; font-weight:950; }
    .parent-tabs button.active { color:#fff; background:#7258e8; box-shadow:0 5px 0 #4c35ad; }
    .album-title { margin:0; font-size:clamp(1.7rem,5vw,2.7rem); }
    .sticker-grid { margin-top:18px; display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:clamp(13px,2.5vw,24px); }
    .sticker-card { position:relative; min-width:0; border:6px solid #fff; border-radius:28px; padding:10px; background:rgba(255,255,255,.7); box-shadow:0 10px 24px rgba(54,56,104,.17); text-align:center; }
    .sticker-card img { width:100%; aspect-ratio:1; display:block; object-fit:contain; }
    .number { position:absolute; top:10px; left:10px; min-width:39px; padding:7px 9px; border-radius:999px; color:#775400; background:#ffe25b; font-weight:1000; box-shadow:0 3px 0 #d3ac21; }
    .label { margin:3px 0 5px; font-weight:950; }
    .empty { margin-top:20px; padding:45px 20px; border:5px dashed rgba(75,83,128,.25); border-radius:28px; background:rgba(255,255,255,.55); text-align:center; font-size:1.2rem; font-weight:900; }
    .credits { margin:28px 0 0; color:#52617b; text-align:center; font-size:.78rem; font-weight:700; }
    .credits a { color:inherit; }
    @media(max-width:800px){.sticker-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
    @media(max-width:560px){.sticker-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.sticker-card{border-width:4px;border-radius:22px}}
  </style>
</head>
<body>
  <main class="shell">
    <section class="hero"><h1>🌟 My Sticker Book</h1><p>Every sticker remembers something you got right!</p></section>
    <div class="toolbar"><a class="back" href="/">◀ Home</a><div class="parent-tabs" id="parentTabs" hidden></div></div>
    <h2 class="album-title" id="albumTitle">Loading stickers...</h2>
    <section class="sticker-grid" id="stickerGrid" aria-live="polite"></section>
    <div class="empty" id="emptyMessage" hidden>Win your first sticker in Find the Picture! 🎯</div>
    <p class="credits">School reward icons adapted from <a href="https://openmoji.org/">OpenMoji</a>, CC BY-SA 4.0.</p>
  </main>
  <script src="/assets/audio-player.js"></script>
  <script src="/assets/site-shell.js"></script>
  <script>
    async function loadAlbum(requestedProfile = "") {
      await window.ProfileShell.ready;
      const query = requestedProfile ? `?profile=${encodeURIComponent(requestedProfile)}` : "";
      const response = await fetch(`/api/rewards${query}`, { credentials: "same-origin" });
      const data = await response.json();
      document.getElementById("albumTitle").textContent = `${data.profile}'s stickers (${data.stickers.length})`;
      const grid = document.getElementById("stickerGrid");
      grid.innerHTML = data.stickers.map(sticker => `
        <article class="sticker-card">
          <span class="number">${sticker.position}</span>
          <img src="${sticker.image}" alt="${sticker.category_label} sticker number ${sticker.position}" loading="lazy">
          <p class="label">${sticker.category_label}</p>
        </article>
      `).join("");
      document.getElementById("emptyMessage").hidden = data.stickers.length !== 0;
      document.querySelectorAll("#parentTabs button").forEach(button => button.classList.toggle("active", button.dataset.profile === data.profile));
    }
    window.ProfileShell.ready.then(profile => {
      const tabs = document.getElementById("parentTabs");
      if (profile === window.ProfileShell.parentProfile) {
        tabs.hidden = false;
        tabs.innerHTML = window.ProfileShell.childProfiles.map(name => `<button data-profile="${name}">${name}</button>`).join("");
        tabs.querySelectorAll("button").forEach(button => button.addEventListener("click", () => loadAlbum(button.dataset.profile)));
        loadAlbum(window.ProfileShell.childProfiles[0]);
      } else {
        loadAlbum();
      }
    });
  </script>
</body>
</html>
