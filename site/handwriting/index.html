<!doctype html>
<html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Fun Tracing</title><link rel="stylesheet" href="/assets/site-shell.css">
<style>
:root{font-family:"Trebuchet MS",system-ui,sans-serif;color:#193361}*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:120px 18px 45px;background:linear-gradient(135deg,#6d65e9,#57d5e7 58%,#fff1ad)}main{max-width:1180px;margin:auto}.title{text-align:center;color:#fff;font-size:clamp(2.7rem,7vw,5rem);margin:0 0 12px;text-shadow:0 7px 0 #4932a8}.mode-tabs,.number-levels{display:flex;justify-content:center;flex-wrap:wrap;gap:10px;margin:12px auto}.tab,.level{border:4px solid #fff;border-radius:999px;background:#f7fbff;color:#193361;padding:12px 20px;font-weight:1000;box-shadow:0 6px 0 #b8cfe8;cursor:pointer}.tab.active,.level.active{background:#f15170;color:#fff;box-shadow:0 6px 0 #a7254a}.progress{max-width:700px;margin:18px auto;background:#f4fbff;border:6px solid #fff;border-radius:22px;padding:12px;text-align:center;font-weight:1000}.track{height:12px;background:#dce8f7;border-radius:999px;margin-top:8px;overflow:hidden}.fill{height:100%;width:0;background:linear-gradient(90deg,#f15170,#ffca35);transition:width .3s}.workspace{display:grid;grid-template-columns:250px 1fr;gap:22px}.choices{align-self:start;background:#dff7ff;border:7px solid #fff;border-radius:26px;padding:14px;display:grid;grid-template-columns:repeat(5,1fr);gap:8px;box-shadow:0 9px 0 #4caac7}.choice{border:0;border-radius:13px;background:#6e51df;color:#fff;min-height:48px;font-weight:1000;font-size:1rem;box-shadow:0 5px 0 #4930a8;cursor:pointer}.choice.active{background:#ef5372;box-shadow:0 5px 0 #ae294b}.choice.done{background:#2ebf73;box-shadow:0 5px 0 #17874d}.shape-choices{grid-template-columns:repeat(3,1fr)}.shape-choices .choice{font-size:.76rem;padding:5px 2px}.board-card{background:#f8fdff;border:7px solid #fff;border-radius:30px;padding:22px;box-shadow:0 10px 0 #2d699e}.board-head{display:flex;justify-content:space-between;align-items:center;gap:14px}.board-head h2{margin:0;font-size:clamp(1.15rem,3vw,1.7rem)}.canvas-wrap{position:relative;margin-top:14px;border:5px solid #dce8f7;border-radius:24px;overflow:hidden;background:repeating-linear-gradient(#fff 0 67px,#eaf2ff 68px 70px)}canvas{display:block;width:100%;height:auto;touch-action:none}.actions{display:flex;justify-content:center;gap:12px;margin-top:15px;flex-wrap:wrap}.action{border:0;border-radius:999px;padding:13px 22px;font-weight:1000;font-size:1rem;cursor:pointer}.check{background:#f15170;color:#fff;box-shadow:0 6px 0 #aa294b}.clear{background:#fff;color:#193361;box-shadow:0 6px 0 #c5d6ea}.feedback{text-align:center;min-height:28px;font-weight:1000;font-size:1.05rem}.score{display:flex;gap:12px;justify-content:center;font-size:.85rem;opacity:.82}
@media(max-width:800px){body{padding:105px 10px 30px}.workspace{grid-template-columns:1fr}.choices{grid-template-columns:repeat(8,1fr);padding:10px;border-width:5px}.shape-choices{grid-template-columns:repeat(3,1fr)}.choice{min-height:42px}.board-card{padding:12px;border-width:5px}.title{font-size:2.8rem}.tab,.level{padding:9px 13px;font-size:.84rem}}
@media(max-width:460px){.choices{grid-template-columns:repeat(5,1fr)}.shape-choices{grid-template-columns:repeat(3,1fr)}.shape-choices .choice{font-size:.68rem}.number-levels{gap:6px}.level{padding:7px 10px;font-size:.72rem}}
</style></head>
<body><main><h1 class="title">✏️ Fun Tracing</h1>
<div class="mode-tabs"><button class="tab active" data-mode="letters">ABC Letters</button><button class="tab" data-mode="numbers">123 Numbers</button><button class="tab" data-mode="shapes">♡ Shapes</button></div>
<div class="number-levels" id="numberLevels" hidden></div>
<div class="progress"><span id="progressText">0 completed</span><div class="track"><div class="fill" id="progressFill"></div></div></div>
<div class="workspace"><aside class="choices" id="choices"></aside><section class="board-card"><div class="board-head"><h2 id="instruction">Trace over the dotted A</h2></div>
<div class="canvas-wrap"><canvas id="guide" width="760" height="560"></canvas><canvas id="drawing" width="760" height="560" style="position:absolute;inset:0"></canvas></div>
<div class="actions"><button class="action clear" id="clear">Clear</button><button class="action check" id="check">Check my tracing</button></div><p class="feedback" id="feedback" aria-live="polite"></p><div class="score" id="score"></div></section></div></main>
<script src="/assets/site-shell.js"></script><script>
(function(){
 const letters=[..."ABCDEFGHIJKLMNOPQRSTUVWXYZ"],shapes=["circle","square","triangle","diamond","pentagon","heart","star","hexagon","oval"];
 const guide=document.getElementById("guide"),draw=document.getElementById("drawing"),g=guide.getContext("2d"),d=draw.getContext("2d");
 const ideal=document.createElement("canvas"),allowed=document.createElement("canvas"),nearInk=document.createElement("canvas");[ideal,allowed,nearInk].forEach(c=>{c.width=760;c.height=560});
 let mode="letters",level=0,current="A",completed=new Set(),drawing=false,last=null,distance=0,hasInk=false;
 const byId=id=>document.getElementById(id);
 const api=async(path,options={})=>{const r=await fetch(path,{credentials:"same-origin",headers:{"Content-Type":"application/json"},...options});const j=await r.json();if(!r.ok)throw new Error(j.error||"Try again.");return j};
 const activity=()=>mode==="numbers"?"numbers-"+(level*10+1)+"-"+(level*10+10):mode;
 const items=()=>mode==="letters"?letters:mode==="shapes"?shapes:Array.from({length:10},(_,i)=>String(level*10+i+1));
 function setupStroke(ctx,width,colour,dashed){ctx.clearRect(0,0,760,560);ctx.strokeStyle=colour;ctx.lineWidth=width;ctx.lineCap="round";ctx.lineJoin="round";ctx.setLineDash(dashed?[5,13]:[])}
 function drawShape(ctx,name){
   ctx.beginPath();
   if(name==="circle"){ctx.arc(380,280,165,0,Math.PI*2)}
   else if(name==="square"){ctx.rect(220,120,320,320)}
   else if(name==="triangle"){ctx.moveTo(380,95);ctx.lineTo(570,440);ctx.lineTo(190,440);ctx.closePath()}
   else if(name==="diamond"){ctx.moveTo(380,85);ctx.lineTo(585,280);ctx.lineTo(380,475);ctx.lineTo(175,280);ctx.closePath()}
   else if(name==="pentagon"){for(let i=0;i<5;i++){const a=-Math.PI/2+i*Math.PI*2/5,x=380+190*Math.cos(a),y=285+190*Math.sin(a);i?ctx.lineTo(x,y):ctx.moveTo(x,y)}ctx.closePath()}
   else if(name==="hexagon"){for(let i=0;i<6;i++){const a=i*Math.PI/3,x=380+190*Math.cos(a),y=280+190*Math.sin(a);i?ctx.lineTo(x,y):ctx.moveTo(x,y)}ctx.closePath()}
   else if(name==="oval"){ctx.ellipse(380,280,135,195,0,0,Math.PI*2)}
   else if(name==="heart"){ctx.moveTo(380,450);ctx.bezierCurveTo(330,390,175,300,205,190);ctx.bezierCurveTo(230,100,345,115,380,195);ctx.bezierCurveTo(415,115,530,100,555,190);ctx.bezierCurveTo(585,300,430,390,380,450)}
   else if(name==="star"){for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,r=i%2?78:190,x=380+r*Math.cos(a),y=280+r*Math.sin(a);i?ctx.lineTo(x,y):ctx.moveTo(x,y)}ctx.closePath()}
   ctx.stroke();
 }
 function drawText(ctx,value){const size=value.length===1?370:value.length===2?285:220;ctx.font="900 "+size+"px Arial";ctx.textAlign="center";ctx.textBaseline="middle";ctx.strokeText(value,380,300)}
 function renderPath(ctx,item){if(mode==="shapes")drawShape(ctx,item);else drawText(ctx,item)}
 function renderGuide(){
   setupStroke(g,9,"#71819c",true);renderPath(g,current);
   const ic=ideal.getContext("2d");setupStroke(ic,8,"#000",false);renderPath(ic,current);
   const ac=allowed.getContext("2d");setupStroke(ac,86,"#000",false);renderPath(ac,current);
   clearDrawing(false);
   byId("instruction").textContent="Trace over the dotted "+(mode==="shapes"?current:current);
 }
 function clearDrawing(show=true){d.clearRect(0,0,760,560);nearInk.getContext("2d").clearRect(0,0,760,560);distance=0;hasInk=false;if(show){byId("feedback").textContent="";byId("score").textContent=""}}
 function updateProgress(){const total=items().length,count=items().filter(x=>completed.has(x)).length;byId("progressText").textContent=count+" of "+total+" completed in "+(mode==="numbers"?"this number level":mode);byId("progressFill").style.width=(count/total*100)+"%"}
 function renderChoices(){const box=byId("choices");box.classList.toggle("shape-choices",mode==="shapes");box.innerHTML=items().map(x=>'<button class="choice '+(x===current?"active ":"")+(completed.has(x)?"done":"")+'" data-item="'+x+'">'+(mode==="shapes"?x[0].toUpperCase()+x.slice(1):x)+'</button>').join("");box.querySelectorAll("button").forEach(b=>b.onclick=()=>{current=b.dataset.item;renderChoices();renderGuide()});updateProgress()}
 function renderLevels(){const box=byId("numberLevels");box.hidden=mode!=="numbers";box.innerHTML=Array.from({length:10},(_,i)=>'<button class="level '+(i===level?"active":"")+'" data-level="'+i+'">'+(i*10+1)+"–"+(i*10+10)+'</button>').join("");box.querySelectorAll("button").forEach(b=>b.onclick=async()=>{level=Number(b.dataset.level);current=String(level*10+1);renderLevels();await loadProgress()})}
 function point(event){const r=draw.getBoundingClientRect();return{x:(event.clientX-r.left)*760/r.width,y:(event.clientY-r.top)*560/r.height}}
 function line(ctx,a,b,width){ctx.strokeStyle="#ee4f73";ctx.lineWidth=width;ctx.lineCap="round";ctx.lineJoin="round";ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke()}
 draw.addEventListener("pointerdown",e=>{drawing=true;last=point(e);draw.setPointerCapture(e.pointerId);hasInk=true});
 draw.addEventListener("pointermove",e=>{if(!drawing)return;const p=point(e);line(d,last,p,24);line(nearInk.getContext("2d"),last,p,74);distance+=Math.hypot(p.x-last.x,p.y-last.y);last=p});
 const stop=()=>{drawing=false;last=null};draw.addEventListener("pointerup",stop);draw.addEventListener("pointercancel",stop);
 function scoreTrace(){
   if(!hasInk||distance<180)return{coverage:0,accuracy:0,pass:false};
   const a=ideal.getContext("2d").getImageData(0,0,760,560).data,n=nearInk.getContext("2d").getImageData(0,0,760,560).data,u=d.getImageData(0,0,760,560).data,ok=allowed.getContext("2d").getImageData(0,0,760,560).data;
   let guideCount=0,covered=0,inkCount=0,inside=0;
   for(let y=0;y<560;y+=4)for(let x=0;x<760;x+=4){const i=(y*760+x)*4;if(a[i+3]>30){guideCount++;if(n[i+3]>20)covered++}if(u[i+3]>30){inkCount++;if(ok[i+3]>20)inside++}}
   const coverage=guideCount?covered/guideCount:0,accuracy=inkCount?inside/inkCount:0;
   return{coverage,accuracy,pass:coverage>=.70&&accuracy>=.62&&distance>=260};
 }
 async function complete(){
   const score=scoreTrace();byId("score").textContent="Guide covered "+Math.round(score.coverage*100)+"% · On the line "+Math.round(score.accuracy*100)+"%";
   if(!score.pass){byId("feedback").textContent=score.coverage<.70?"Nearly there. Follow more of the dotted line.":"Good try. Keep your pencil closer to the dotted line.";return}
   byId("feedback").textContent="Lovely tracing!";byId("check").disabled=true;
   try{const result=await api("/api/progress/complete",{method:"POST",body:JSON.stringify({activity:activity(),item:current})});completed.add(current);renderChoices();if(result.exercise_completed&&result.reward_token){await ProfileShell.claimReward(result.reward_token);completed.clear();renderChoices()}else{const list=items(),next=list.find(x=>!completed.has(x));if(next){setTimeout(()=>{current=next;renderChoices();renderGuide();byId("check").disabled=false},650)}else byId("check").disabled=false}}catch(e){byId("feedback").textContent=e.message;byId("check").disabled=false}}
 async function loadProgress(){document.body.dataset.progressActivity=activity();try{const p=await api("/api/progress?activity="+encodeURIComponent(activity()));completed=new Set(p.completed_items);if(!items().includes(current))current=items()[0];renderChoices();renderGuide()}catch(e){byId("feedback").textContent=e.message}}
 byId("clear").onclick=()=>clearDrawing();byId("check").onclick=complete;
 document.querySelectorAll(".tab").forEach(b=>b.onclick=async()=>{mode=b.dataset.mode;document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("active",x===b));current=items()[0];renderLevels();await loadProgress()});
 ProfileShell.ready.then(()=>{renderLevels();loadProgress()});
})();
</script></body></html>
