<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Our Book Shelf</title>
  <link rel="stylesheet" href="../assets/site-shell.css">
  <style>
    :root{font-family:"Trebuchet MS",system-ui,sans-serif;color:#20345d}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;padding:118px 16px 48px;background:linear-gradient(145deg,#7162eb,#57cee8 58%,#fff1a4);overflow-x:hidden}
    .library{width:min(1360px,100%);margin:auto;text-align:center}
    .library h1{margin:0;color:#fff;font-size:clamp(2.7rem,7vw,5.4rem);line-height:.95;text-shadow:0 7px 0 #33478c}
    .library>p{position:relative;left:clamp(14px,2vw,32px);font-size:clamp(1rem,2.5vw,1.3rem);font-weight:900}
    .bookcase{position:relative;margin:34px auto 0;width:min(1320px,100%);min-height:300px;padding:28px 22px 38px;border:18px solid #7d3f20;border-radius:28px;background:linear-gradient(90deg,#bd652e,#e7a55f 45%,#bd652e);box-shadow:inset 0 0 0 7px #f6c07e,0 18px 0 #49356e,0 30px 50px #20345d55}
    .shelf-stack{position:relative;z-index:1;display:grid;gap:25px}
    .empty-shelf{display:grid;place-items:center;min-height:180px;padding:24px;border-radius:18px;background:#fff3d9d9;color:#263867;font-size:clamp(1.1rem,2.5vw,1.5rem);font-weight:1000;box-shadow:inset 0 0 0 4px #fff8}
    .shelf-row{position:relative;display:grid;grid-template-columns:repeat(var(--shelf-columns,6),minmax(0,1fr));align-items:end;gap:clamp(9px,1.3vw,18px);min-height:285px;padding:16px 16px 24px;border-radius:12px 12px 5px 5px;background:linear-gradient(90deg,#7a3c20 0,#b96332 3%,#d98d50 50%,#a6532a 97%,#73351d 100%);box-shadow:inset 0 12px 22px #45200f55}
    .shelf-row:after{content:"";position:absolute;z-index:30;left:-17px;right:-17px;bottom:-8px;height:25px;border-radius:6px;background:linear-gradient(#f0b872,#985027 72%);box-shadow:0 8px 0 #6c391e,0 12px 15px #44251555;pointer-events:none}
    .shelf-book{position:relative;width:100%;max-width:170px;justify-self:center;aspect-ratio:.82;padding:0;border:0;border-radius:3px 9px 9px 3px;background:#263867;box-shadow:-4px 0 0 #4e31ae,5px 7px 10px #462a195f;cursor:pointer;transform-origin:center;transition:filter .2s,transform .25s;isolation:isolate;overflow:hidden}
    .shelf-book:hover,.shelf-book:focus-visible{transform:translateY(-10px) scale(1.05);filter:brightness(1.08);z-index:35}
    .shelf-book img{display:block;width:100%;height:100%;object-fit:cover;object-position:center;border-radius:inherit;background:#263867}
    .shelf-title{position:absolute;inset:auto 0 0;min-height:56px;padding:21px 6px 7px;border-radius:0 0 8px 2px;background:linear-gradient(180deg,transparent 0,rgba(25,40,76,.78) 38%,rgba(25,40,76,.96) 100%);color:#fff;font-size:clamp(.57rem,.75vw,.76rem);font-weight:1000;line-height:1.02;text-shadow:0 1px 2px #101a36;display:flex;align-items:flex-end;justify-content:center;text-wrap:balance;overflow-wrap:break-word;word-break:normal;overflow:hidden}
    .shelf-book.long-title .shelf-title{font-size:clamp(.5rem,.66vw,.67rem);line-height:1}
    .shelf-book.leaving{animation:leaveShelf 1.55s cubic-bezier(.2,.72,.14,1) forwards;z-index:80;pointer-events:none;overflow:visible}
    .shelf-book.leaving:before{content:"";position:absolute;z-index:5;inset:-9px;border:4px solid #fff7a8;border-radius:14px;box-shadow:0 0 24px #fff,0 0 44px #ffe147;animation:bookGlow 1.5s ease-out both;pointer-events:none}
    .shelf-book.leaving:after{content:"✦  ✨  ✦";position:absolute;z-index:6;inset:10% -90%;display:grid;place-items:center;color:#ffe65b;font-size:clamp(1rem,3vw,2.1rem);letter-spacing:.35rem;text-shadow:0 0 12px #fff,0 0 28px #ffe05b;pointer-events:none;animation:shelfMagic 1.5s ease-out forwards}
    .reader{position:fixed;z-index:2000;inset:0;display:grid;place-items:center;padding:72px 18px 22px;background:radial-gradient(circle,#7fe3f2,#314988ef 70%);opacity:0;visibility:hidden;transition:opacity .48s ease}
    .reader.open{opacity:1;visibility:visible}
    .reader-shell{width:min(1180px,96vw)}
    .reader-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;color:#fff;font-weight:1000}
    .reader-heading{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.read-aloud{padding:9px 14px;border:3px solid #fff;border-radius:999px;background:#ffe265;color:#273965;font:1000 .9rem "Trebuchet MS",sans-serif;box-shadow:0 4px 0 #ad7d09;cursor:pointer}.read-aloud.reading{background:#f35b82;color:#fff;box-shadow:0 4px 0 #a62950}.voice-status{min-height:1.15em;margin:8px 0 0;color:#fff;text-align:center;font-weight:1000}
    .reader-close{width:48px;height:48px;border:4px solid #fff;border-radius:50%;background:#263b74;color:#fff;font-size:1.5rem;cursor:pointer;box-shadow:0 5px 0 #17234a}
    .book-spread{position:relative;display:grid;grid-template-columns:1fr 1fr;width:100%;height:min(70vh,690px);min-height:420px;perspective:1500px;filter:drop-shadow(0 24px 24px #15254c66);transform:scale(.12) rotateY(-68deg) rotateZ(-5deg);opacity:0;transition:transform 1.05s cubic-bezier(.12,.88,.18,1),opacity .42s ease}
    .reader.open .book-spread{transform:scale(1) rotateY(0) rotateZ(0);opacity:1}
    .book-spread:after{content:"";position:absolute;top:2%;bottom:2%;left:50%;width:14px;transform:translateX(-50%);background:linear-gradient(90deg,#a47c5366,#fff8dc,#a47c5366);border-radius:50%;z-index:5}
    .page{position:relative;overflow:hidden;background:linear-gradient(90deg,#fff9e8,#fffef8);border:5px solid #fff3d3;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:clamp(20px,4vw,52px);box-shadow:inset 0 0 35px #c99a4f20}
    .page.left{border-radius:28px 4px 4px 28px}.page.right{border-radius:4px 28px 28px 4px}
    .page.image-page{padding:12px}.page img{width:100%;height:100%;object-fit:contain;border-radius:18px;background:#fff9e8}
    .page h2{margin:.2em 0;color:#5140bb;font-size:clamp(2rem,4vw,4.2rem);line-height:.95}.page h3{margin:.2em 0;font-size:clamp(1.4rem,2.7vw,2.5rem);color:#e64075}
    .page p{margin:.55em 0;font-size:clamp(1.08rem,1.85vw,1.6rem);font-weight:900;line-height:1.42;max-width:18em}.big-emoji{font-size:clamp(4rem,10vw,8rem)}
    .story-stars{color:#f4ba16;font-size:1.5rem;letter-spacing:.25em}.page-number{position:absolute;bottom:11px;color:#846e57;font-weight:900;font-size:.82rem}
    .reader-controls{display:flex;align-items:center;justify-content:center;gap:13px;margin-top:15px}.page-btn{min-width:122px;padding:12px 18px;border:4px solid #fff;border-radius:999px;background:#694de1;color:#fff;font:1000 1rem "Trebuchet MS",sans-serif;box-shadow:0 6px 0 #39258e;cursor:pointer}.page-btn:disabled{opacity:.4}.spread-count{min-width:130px;color:#fff;font-weight:1000;transform:translateX(22px)}
    @keyframes leaveShelf{0%{transform:translate(0,0) rotate(0) scale(1);filter:brightness(1);opacity:1}12%{transform:translate(0,7px) rotate(0) scale(.96);filter:brightness(1)}28%{transform:translate(0,-28px) rotate(-3deg) scale(1.08);filter:brightness(1.12)}52%{transform:perspective(900px) translate(0,-64px) rotateY(-22deg) rotateZ(3deg) scale(1.35);filter:brightness(1.22) drop-shadow(0 14px 16px #3d245e77);opacity:1}82%{transform:perspective(900px) translate(var(--book-flight-x),var(--book-flight-y)) rotateY(8deg) rotateZ(0) scale(1.82);filter:brightness(1.32) drop-shadow(0 20px 25px #26315f88);opacity:1}100%{transform:perspective(900px) translate(var(--book-flight-x),var(--book-flight-y)) rotateY(0) scale(2.25);filter:brightness(1.42);opacity:0}}
    @keyframes bookGlow{0%{opacity:0;transform:scale(.72)}25%{opacity:1}72%{opacity:.9;transform:scale(1.18)}100%{opacity:0;transform:scale(1.5)}}
    @keyframes shelfMagic{0%{transform:scale(.2) rotate(-25deg);opacity:0}24%{opacity:1}74%{opacity:1;transform:scale(1.35) rotate(8deg)}100%{transform:scale(2) rotate(24deg);opacity:0}}
    @media(max-width:650px){body{padding:108px 6px 30px}.bookcase{min-height:215px;padding:18px 8px 29px;border-width:11px;border-radius:20px}.shelf-stack{gap:20px}.shelf-row{min-height:185px;padding:10px 5px 16px;gap:9px}.shelf-row:after{left:-9px;right:-9px;height:18px}.shelf-book{max-width:116px;border-radius:2px 5px 5px 2px;box-shadow:-2px 0 0 #4e31ae,3px 4px 6px #462a195f}.shelf-title{min-height:47px;padding:17px 4px 5px;font-size:clamp(.5rem,2.8vw,.72rem);line-height:.98}.shelf-book.long-title .shelf-title{font-size:clamp(.45rem,2.5vw,.65rem)}.reader{padding:70px 6px 10px}.book-spread{height:61vh;min-height:400px}.page{padding:14px 11px}.page p{font-size:clamp(.86rem,3.15vw,1.05rem);line-height:1.35}.page h2{font-size:clamp(1.5rem,6vw,2.4rem)}.page h3{font-size:clamp(1.05rem,4vw,1.55rem)}.page.image-page{padding:6px}.page-btn{min-width:94px;padding:9px 11px;font-size:.86rem}.reader-top{font-size:.9rem}.reader-heading{gap:7px}.read-aloud{padding:7px 9px;font-size:.76rem}.spread-count{min-width:100px;transform:translateX(12px)}}
    @media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
  </style>
</head>
<body>
  <main class="library">
    <h1>📚 Our Book Shelf</h1>
    <p>Tap a book and watch it jump off the shelf!</p>
    <section class="bookcase" aria-label="Story books"><div class="shelf-stack" id="shelfStack"></div></section>
  </main>
  <section class="reader" id="reader" aria-hidden="true">
    <div class="reader-shell">
      <div class="reader-top"><div class="reader-heading"><span id="readerTitle">📖 Story</span><button class="read-aloud" id="readAloud" type="button" aria-pressed="false">🔊 Read aloud</button></div><button class="reader-close" id="closeReader" type="button" aria-label="Close book">✕</button></div>
      <div class="book-spread"><article class="page left" id="leftPage"></article><article class="page right" id="rightPage"></article></div>
      <p class="voice-status" id="voiceStatus" aria-live="polite"></p>
      <nav class="reader-controls"><button class="page-btn" id="previousPage" type="button">← Back</button><span class="spread-count" id="spreadCount"></span><button class="page-btn" id="nextPage" type="button">Next →</button></nav>
    </div>
  </section>
  <script src="../assets/site-shell.js"></script>
  <script>
  (function(){
    let books=[],active=null,current=0,activeButton=null,reading=false,playingFinalWords=false,playId=0,endingTimer=0;
    const narration=new Audio();narration.preload="auto";
    const byId=id=>document.getElementById(id);
    const asset=src=>String(src).startsWith("/")?ProfileShell.url(src):src;
    let shelfColumnCount=0,resizeTimer=0;
    function shelfColumns(){return window.innerWidth<=650?2:(window.innerWidth<=1050?4:6);}
    function drawShelf(){
      const shelf=byId("shelfStack");shelf.innerHTML="";
      if(!books.length){shelf.innerHTML='<div class="empty-shelf">No books yet. Ask a grown-up to run generate-book.</div>';return;}
      const perShelf=shelfColumns();shelfColumnCount=perShelf;
      books.forEach((book,index)=>{
        if(index%perShelf===0){const row=document.createElement("div");row.className="shelf-row";row.style.setProperty("--shelf-columns",perShelf);row.setAttribute("aria-label","Shelf "+(Math.floor(index/perShelf)+1));shelf.appendChild(row);}
        const button=document.createElement("button");button.className="shelf-book";button.type="button";
        if(String(book.title||"").length>18||String(book.title||"").trim().split(/\s+/).length>3)button.classList.add("long-title");
        const image=document.createElement("img");image.src=asset(book.cover);image.alt="Cover of "+book.title;
        const title=document.createElement("span");title.className="shelf-title";title.textContent=book.title;
        button.append(image,title);button.onclick=()=>openBook(book,button);shelf.lastElementChild.appendChild(button);
      });
    }
    function openBook(book,button){
      if(button.classList.contains("leaving"))return;
      stopReading();
      active=book;current=0;activeButton=button;
      const rect=button.getBoundingClientRect();
      button.style.setProperty("--book-flight-x",(window.innerWidth/2-(rect.left+rect.width/2))+"px");
      button.style.setProperty("--book-flight-y",(window.innerHeight/2-(rect.top+rect.height/2))+"px");
      button.classList.add("leaving");
      const openingDelay=window.matchMedia("(prefers-reduced-motion: reduce)").matches?0:1320;
      setTimeout(()=>{byId("readerTitle").textContent="📖 "+book.title;draw();byId("reader").classList.add("open");byId("reader").setAttribute("aria-hidden","false");},openingDelay);
    }
    function closeBook(){
      stopReading();
      byId("reader").classList.remove("open");byId("reader").setAttribute("aria-hidden","true");
      current=0;active=null;if(activeButton){activeButton.classList.remove("leaving");activeButton.style.removeProperty("--book-flight-x");activeButton.style.removeProperty("--book-flight-y");activeButton=null;}
    }
    function renderPage(element,page,number){
      element.className="page "+(element===byId("leftPage")?"left":"right")+(page&&page.type==="image"?" image-page":"");element.innerHTML="";
      if(!page){const h=document.createElement("h2");h.textContent="The End";element.appendChild(h);return;}
      if(page.type==="image"){
        const image=document.createElement("img");image.src=asset(page.src);image.alt=page.alt||"Story picture";element.appendChild(image);
      }else if(page.type==="end"){
        const stars=document.createElement("div");stars.className="story-stars";stars.textContent="★ ★ ★";element.appendChild(stars);
        const paragraph=document.createElement("p");paragraph.textContent=page.text||"";element.appendChild(paragraph);
        const heading=document.createElement("h2");heading.textContent=page.title||"The End";element.appendChild(heading);
        const icon=document.createElement("div");icon.className="big-emoji";icon.textContent="🌟📖";element.appendChild(icon);
      }else{
        if(page.type==="title"){const stars=document.createElement("div");stars.className="story-stars";stars.textContent="★ ★ ★";element.appendChild(stars);}
        const heading=document.createElement(page.type==="title"?"h2":"h3");heading.textContent=page.title||active.title;element.appendChild(heading);
        const paragraph=document.createElement("p");paragraph.textContent=page.text||"";element.appendChild(paragraph);
      }
      const mark=document.createElement("span");mark.className="page-number";mark.textContent=number<=active.pages.length?number:"";element.appendChild(mark);
    }
    function draw(){
      const first=current*2;renderPage(byId("leftPage"),active.pages[first],first+1);renderPage(byId("rightPage"),active.pages[first+1],first+2);
      const total=Math.ceil(active.pages.length/2);byId("previousPage").disabled=current===0;byId("nextPage").textContent=current===total-1?"Again ↻":"Next →";
      byId("spreadCount").textContent=(first+1)+"–"+Math.min(first+2,active.pages.length)+" of "+active.pages.length;
    }
    function narrationUrl(){return ProfileShell.url("/generated-books/narration/"+encodeURIComponent(active.slug)+"/spread-"+(current+1)+".mp3");}
    function finalWordsUrl(){return ProfileShell.url("/generated-books/narration/"+encodeURIComponent(active.slug)+"/spread-8-end.mp3");}
    function updateReadButton(){const button=byId("readAloud");button.classList.toggle("reading",reading);button.setAttribute("aria-pressed",String(reading));button.textContent=reading?"⏹ Stop reading":"🔊 Read aloud";}
    function stopReading(message=""){
      reading=false;playingFinalWords=false;playId++;window.clearTimeout(endingTimer);narration.pause();narration.removeAttribute("src");narration.load();
      if(byId("readAloud"))updateReadButton();if(byId("voiceStatus"))byId("voiceStatus").textContent=message;
    }
    async function playCurrentSpread(){
      if(!reading||!active)return;playingFinalWords=false;window.clearTimeout(endingTimer);const thisPlay=++playId;byId("voiceStatus").textContent="Reading this page…";
      narration.src=narrationUrl();narration.currentTime=0;
      try{await narration.play();}catch(_){if(thisPlay!==playId)return;stopReading("Narration is not ready yet. Ask a grown-up to run narrate-books.");}
    }
    async function playFinalWords(){
      if(!reading||!active)return;playingFinalWords=true;const thisPlay=++playId;byId("voiceStatus").textContent="Finishing the story…";
      narration.src=finalWordsUrl();narration.currentTime=0;
      try{await narration.play();}catch(_){if(thisPlay!==playId)return;stopReading("The final words are not ready yet. Ask a grown-up to run narrate-books.");}
    }
    narration.addEventListener("ended",()=>{
      if(!reading||!active)return;const total=Math.ceil(active.pages.length/2);
      if(current>=total-1){
        if(playingFinalWords){stopReading("Story finished! ⭐");return;}
        const finishedPlay=playId;byId("voiceStatus").textContent="Almost finished…";
        endingTimer=window.setTimeout(()=>{if(reading&&active&&playId===finishedPlay)playFinalWords();},1000);
        return;
      }
      current++;draw(1);window.setTimeout(()=>{if(reading)playCurrentSpread();},480);
    });
    narration.addEventListener("error",()=>{if(reading)stopReading("Narration is not ready yet. Ask a grown-up to run narrate-books.");});
    byId("closeReader").onclick=closeBook;
    byId("readAloud").onclick=()=>{if(reading){stopReading();return;}reading=true;updateReadButton();playCurrentSpread();};
    byId("previousPage").onclick=()=>{if(current>0){current--;draw(-1);if(reading)playCurrentSpread();}};
    byId("nextPage").onclick=()=>{const total=Math.ceil(active.pages.length/2);current=current===total-1?0:current+1;draw(1);if(reading)playCurrentSpread();};
    document.addEventListener("keydown",event=>{if(!byId("reader").classList.contains("open"))return;if(event.key==="Escape")closeBook();if(event.key==="ArrowRight")byId("nextPage").click();if(event.key==="ArrowLeft")byId("previousPage").click();});
    window.addEventListener("resize",()=>{window.clearTimeout(resizeTimer);resizeTimer=window.setTimeout(()=>{if(shelfColumns()!==shelfColumnCount)drawShelf();},160);});
    ProfileShell.ready.then(async()=>{
      try{const response=await fetch(ProfileShell.url("/generated-books/books.json"),{cache:"no-store"});if(response.ok){const generated=await response.json();if(Array.isArray(generated.books))books=books.concat(generated.books.filter(book=>book&&Array.isArray(book.pages)&&book.pages.length===16));}}catch(_){}
      drawShelf();
    });
  })();
  </script>
</body>
</html>
