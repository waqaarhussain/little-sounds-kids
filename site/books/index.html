<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Little Learners Books</title><link rel="stylesheet" href="../assets/site-shell.css"><style>
:root{font-family:"Trebuchet MS",system-ui,sans-serif;color:#20345d}*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:118px 16px 48px;background:linear-gradient(145deg,#7162eb,#57cee8 58%,#fff1a4);overflow-x:hidden}.library{width:min(1120px,100%);margin:auto;text-align:center}.library h1{margin:0;color:#fff;font-size:clamp(2.7rem,7vw,5.4rem);line-height:.95;text-shadow:0 7px 0 #33478c}.library>p{font-size:clamp(1rem,2.5vw,1.3rem);font-weight:900}.bookcase{position:relative;margin:34px auto 0;width:min(1040px,98%);min-height:455px;padding:44px 38px 64px;border:18px solid #8b4b25;border-radius:28px;background:linear-gradient(90deg,#c97739,#e6a35e 46%,#bd652e);box-shadow:inset 0 0 0 7px #f6c07e,0 18px 0 #49356e,0 30px 50px #20345d55}.bookcase:after{content:"";position:absolute;left:-15px;right:-15px;bottom:40px;height:28px;border-radius:8px;background:linear-gradient(#f0b872,#985027);box-shadow:0 10px 0 #6c391e}.shelf-row{position:relative;z-index:1;display:flex;align-items:flex-end;justify-content:center;flex-wrap:wrap;gap:28px;min-height:320px}.shelf-book{position:relative;width:190px;height:275px;padding:0;border:0;border-radius:6px 18px 18px 6px;background:#6748d8;box-shadow:-9px 0 0 #4e31ae,11px 11px 18px #462a194f;cursor:pointer;transform-origin:bottom center;transition:filter .2s,transform .25s}.shelf-book:hover,.shelf-book:focus-visible{transform:translateY(-13px) rotate(-2deg);filter:brightness(1.07)}.shelf-book img{width:100%;height:100%;object-fit:cover;border-radius:inherit}.shelf-title{position:absolute;inset:auto 10px 16px;padding:11px 6px;border-radius:10px;background:#fff8dceb;color:#263867;font-size:1.05rem;font-weight:1000;line-height:1.05}.shelf-ribbon{position:absolute;top:14px;right:-7px;padding:7px 11px;background:#ffe45e;border-radius:9px 3px 3px 9px;color:#684900;font-weight:1000;box-shadow:0 4px 0 #c99813}.shelf-book.leaving{animation:leaveShelf .72s cubic-bezier(.2,.8,.3,1) forwards;z-index:20}.reader{position:fixed;z-index:2000;inset:0;display:grid;place-items:center;padding:72px 18px 22px;background:radial-gradient(circle,#7fe3f2,#314988ef 70%);opacity:0;visibility:hidden;transition:opacity .35s}.reader.open{opacity:1;visibility:visible}.reader-shell{width:min(1180px,96vw)}.reader-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;color:#fff;font-weight:1000}.reader-close{width:48px;height:48px;border:4px solid #fff;border-radius:50%;background:#263b74;color:#fff;font-size:1.5rem;cursor:pointer;box-shadow:0 5px 0 #17234a}.book-spread{position:relative;display:grid;grid-template-columns:1fr 1fr;width:100%;height:min(70vh,690px);min-height:420px;perspective:1500px;filter:drop-shadow(0 24px 24px #15254c66);transform:scale(.2) rotateY(-34deg);opacity:0;transition:transform .72s cubic-bezier(.2,.85,.2,1),opacity .35s}.reader.open .book-spread{transform:scale(1);opacity:1}.book-spread:after{content:"";position:absolute;top:2%;bottom:2%;left:50%;width:14px;transform:translateX(-50%);background:linear-gradient(90deg,#a47c5366,#fff8dc,#a47c5366);border-radius:50%;z-index:5}.page{position:relative;overflow:hidden;background:linear-gradient(90deg,#fff9e8,#fffef8);border:5px solid #fff3d3;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:clamp(20px,4vw,52px);box-shadow:inset 0 0 35px #c99a4f20}.page.left{border-radius:28px 4px 4px 28px}.page.right{border-radius:4px 28px 28px 4px}.page.turning-left{animation:turnLeft .48s ease}.page.turning-right{animation:turnRight .48s ease}.page.image-page{padding:12px}.page img{width:100%;height:100%;object-fit:cover;border-radius:18px}.page h2{margin:.2em 0;color:#5140bb;font-size:clamp(2rem,4vw,4.2rem);line-height:.95}.page h3{margin:.2em 0;font-size:clamp(1.4rem,2.7vw,2.5rem);color:#e64075}.page p{margin:.55em 0;font-size:clamp(1.08rem,1.85vw,1.6rem);font-weight:900;line-height:1.42;max-width:18em}.big-emoji{font-size:clamp(4rem,10vw,8rem)}.story-stars{color:#f4ba16;font-size:1.5rem;letter-spacing:.25em}.page-number{position:absolute;bottom:11px;color:#846e57;font-weight:900;font-size:.82rem}.reader-controls{display:flex;align-items:center;justify-content:center;gap:13px;margin-top:15px}.page-btn{min-width:122px;padding:12px 18px;border:4px solid #fff;border-radius:999px;background:#694de1;color:#fff;font:1000 1rem "Trebuchet MS",sans-serif;box-shadow:0 6px 0 #39258e;cursor:pointer}.page-btn:disabled{opacity:.4}.spread-count{min-width:130px;color:#fff;font-weight:1000}@keyframes leaveShelf{45%{transform:translateY(-120px) rotate(-7deg) scale(1.12)}100%{transform:translateY(-150px) scale(1.55);opacity:0}}@keyframes turnLeft{50%{transform:perspective(800px) rotateY(13deg);filter:brightness(1.12)}}@keyframes turnRight{50%{transform:perspective(800px) rotateY(-13deg);filter:brightness(1.12)}}@media(max-width:650px){body{padding:108px 10px 30px}.bookcase{min-height:395px;padding:32px 15px 55px;border-width:13px}.shelf-row{min-height:285px;gap:18px}.shelf-book{width:145px;height:215px}.reader{padding:70px 6px 10px}.book-spread{height:64vh;min-height:430px}.page{padding:14px 11px}.page p{font-size:clamp(.86rem,3.15vw,1.05rem);line-height:1.35}.page h2{font-size:clamp(1.5rem,6vw,2.4rem)}.page h3{font-size:clamp(1.05rem,4vw,1.55rem)}.page.image-page{padding:6px}.page-btn{min-width:94px;padding:9px 11px;font-size:.86rem}.reader-top{font-size:.9rem}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style></head><body><main class="library"><h1>Our Book Shelf</h1><p>Tap a book and watch it come off the shelf!</p><section class="bookcase" aria-label="Book shelf"><div class="shelf-row" id="shelf"></div></section></main>
<section class="reader" id="reader" aria-hidden="true"><div class="reader-shell"><div class="reader-top"><span id="readerTitle">📖 Story</span><button class="reader-close" id="closeReader" type="button" aria-label="Close book">✕</button></div><div class="book-spread"><article class="page left" id="leftPage"></article><article class="page right" id="rightPage"></article></div><nav class="reader-controls"><button class="page-btn" id="previousPage" type="button">← Back</button><span class="spread-count" id="spreadCount"></span><button class="page-btn" id="nextPage" type="button">Next →</button></nav></div></section>
<script src="../assets/site-shell.js"></script><script>
(function(){const base={slug:"rainbow-rescue",title:"The Rainbow Rescue",cover:"rainbow-rescue/cover.webp",pages:[{type:"image",src:"rainbow-rescue/cover.webp",alt:"Friends find a glowing rainbow book"},{type:"title",title:"The Rainbow Rescue",text:"A story about friends who help."},{type:"text",title:"A windy day",text:"Bluey and Bingo sat by a tree. They found a bright book. Whoosh! The colours flew away."},{type:"image",src:"rainbow-rescue/scene-1.webp",alt:"The colours fly out of the book"},{type:"text",title:"Let us help",text:"Ginny ran over. “We can get them back,” she said. The friends made a plan."},{type:"image",src:"rainbow-rescue/scene-2.webp",alt:"The friends reach a number bridge"},{type:"text",title:"One, two, three",text:"One, Two and Three made a bridge. The friends took small steps. They all got across."},{type:"image",src:"rainbow-rescue/scene-2.webp",alt:"The friends cross the bridge"},{type:"text",title:"Up in the sky",text:"Owlette and Skye flew up. They found red, blue and yellow. The colours shone."},{type:"image",src:"rainbow-rescue/scene-3.webp",alt:"The friends find the rainbow puzzle"},{type:"text",title:"A, B, C",text:"A, B and C found three clues. Chase put them in the right place. Click!"},{type:"image",src:"rainbow-rescue/scene-3.webp",alt:"The rainbow puzzle is fixed"},{type:"text",title:"The book is bright",text:"The colours went back in the book. The rainbow came back too. Everyone cheered."},{type:"image",src:"rainbow-rescue/cover.webp",alt:"All the friends celebrate together"},{type:"end",title:"The End",text:"Good friends help each other."}]};let books=[base],active=null,current=0,activeButton=null;const byId=id=>document.getElementById(id);const safe=value=>String(value||"").replace(/[&<>\"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));const asset=src=>String(src).startsWith("/")?ProfileShell.url(src):src;
function drawShelf(){byId("shelf").innerHTML=books.map((book,i)=>'<button class="shelf-book" type="button" data-index="'+i+'" aria-label="Read '+safe(book.title)+'"><img src="'+safe(asset(book.cover))+'" alt=""><span class="shelf-ribbon">'+(i?"NEW!":"READ")+'</span><span class="shelf-title">'+safe(book.title)+'</span></button>').join("");byId("shelf").querySelectorAll("button").forEach(button=>button.onclick=()=>openBook(Number(button.dataset.index),button))}
function renderPage(element,page,number){element.className="page "+(element===byId("leftPage")?"left":"right")+(page&&page.type==="image"?" image-page":"");element.innerHTML="";if(!page){const h=document.createElement("h2");h.textContent="The End";element.appendChild(h);return}if(page.type==="image"){const image=document.createElement("img");image.src=asset(page.src);image.alt=page.alt||"Story picture";element.appendChild(image)}else{if(page.type==="title"||page.type==="end"){const stars=document.createElement("div");stars.className="story-stars";stars.textContent="★ ★ ★";element.appendChild(stars)}const heading=document.createElement(page.type==="title"||page.type==="end"?"h2":"h3");heading.textContent=page.title||active.title;element.appendChild(heading);const p=document.createElement("p");p.textContent=page.text||"";element.appendChild(p);if(page.type==="end"){const icon=document.createElement("div");icon.className="big-emoji";icon.textContent="🌟📖";element.appendChild(icon)}}const mark=document.createElement("span");mark.className="page-number";mark.textContent=number<=active.pages.length?number:"";element.appendChild(mark)}
function draw(direction){const first=current*2;renderPage(byId("leftPage"),active.pages[first],first+1);renderPage(byId("rightPage"),active.pages[first+1],first+2);if(direction){byId("leftPage").classList.add(direction>0?"turning-left":"turning-right");byId("rightPage").classList.add(direction>0?"turning-left":"turning-right")}const total=Math.ceil(active.pages.length/2);byId("previousPage").disabled=current===0;byId("nextPage").textContent=current===total-1?"Again ↻":"Next →";byId("spreadCount").textContent=(first+1)+"–"+Math.min(first+2,active.pages.length)+" of "+active.pages.length}
function openBook(index,button){active=books[index];activeButton=button;current=0;button.classList.add("leaving");setTimeout(()=>{byId("readerTitle").textContent="📖 "+active.title;byId("reader").classList.add("open");byId("reader").setAttribute("aria-hidden","false");draw(0);byId("closeReader").focus()},560)}function closeBook(){byId("reader").classList.remove("open");byId("reader").setAttribute("aria-hidden","true");current=0;setTimeout(()=>{activeButton?.classList.remove("leaving");activeButton?.focus()},360)}
byId("closeReader").onclick=closeBook;byId("previousPage").onclick=()=>{if(current>0){current--;draw(-1)}};byId("nextPage").onclick=()=>{const total=Math.ceil(active.pages.length/2);current=current===total-1?0:current+1;draw(1)};document.addEventListener("keydown",event=>{if(!byId("reader").classList.contains("open"))return;if(event.key==="Escape")closeBook();if(event.key==="ArrowRight")byId("nextPage").click();if(event.key==="ArrowLeft")byId("previousPage").click()});ProfileShell.ready.then(async()=>{try{const response=await fetch(ProfileShell.url("/generated-books/books.json"),{cache:"no-store"});if(response.ok){const generated=await response.json();if(Array.isArray(generated.books))books=books.concat(generated.books.filter(book=>book&&Array.isArray(book.pages)&&book.pages.length===15))}}catch(_){}drawShelf()})})();
</script></body></html>
