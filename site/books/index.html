<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Little Learners Books</title><link rel="stylesheet" href="../assets/site-shell.css"><style>:root{font-family:"Trebuchet MS",system-ui,sans-serif;color:#20345d}*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:120px 18px 50px;background:linear-gradient(145deg,#6f61e9,#55d2e8 58%,#fff2a8);text-align:center}.shelf{width:min(900px,100%);margin:auto;padding:clamp(25px,6vw,55px);border:7px solid #fff;border-radius:34px;background:#fff9e8;box-shadow:0 12px 0 #365394,0 24px 55px #18315f38}h1{margin:0;font-size:clamp(2.6rem,8vw,5.2rem);color:#314987}.book{font-size:clamp(5rem,18vw,10rem);filter:drop-shadow(0 12px 8px #31498735);animation:bookFloat 2.4s ease-in-out infinite}p{font-size:clamp(1rem,3vw,1.35rem);font-weight:900;line-height:1.5}.coming{display:inline-block;margin-top:10px;padding:10px 20px;border-radius:999px;background:#ffe56d;color:#704e00;font-weight:1000}@keyframes bookFloat{50%{transform:translateY(-10px) rotate(3deg)}}@media(prefers-reduced-motion:reduce){.book{animation:none}}</style></head><body><main class="shelf"><div class="book">📚</div><h1>Our Book Shelf</h1><p>This is where our Little Learners books will live.</p><span class="coming">New books coming soon</span></main><script src="../assets/site-shell.js"></script></body></html>
